name: Build and publish release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing SemVer tag to publish, for example v1.0.1'
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            appimage_arch: x86_64
          - rid: linux-arm64
            appimage_arch: aarch64
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - name: Resolve version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish application
        run: |
          dotnet publish Steamalt.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.version }}.0 \
            -p:FileVersion=${{ steps.version.outputs.version }}.0 \
            -p:InformationalVersion=${{ steps.version.outputs.version }} \
            --output "publish/${{ matrix.rid }}"
          cp icon.png "publish/${{ matrix.rid }}/"

      - name: Upload compiled build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          if-no-files-found: error

  appimage:
    name: Build AppImage ${{ matrix.rid }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-x64
            appimage_arch: x86_64
          - rid: linux-arm64
            appimage_arch: aarch64
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - name: Download compiled build
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

      - name: Install AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes squashfs-tools
          # appimagetool runs on the x86-64 CI host; ARCH selects the target runtime.
          curl --fail --location --output appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - name: Create AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/lib/steamalt AppDir/usr/share/applications
          cp -a "publish/${{ matrix.rid }}/." AppDir/usr/lib/steamalt/
          cp icon.png AppDir/steamalt.png
          cat > AppDir/steamalt.desktop <<'EOF'
          [Desktop Entry]
          Name=Steamalt
          Comment=Launch Steam games through Firejail
          Exec=steamalt
          Icon=steamalt
          Type=Application
          Categories=Game;
          Terminal=false
          EOF
          sed -i 's/^[[:space:]]*//' AppDir/steamalt.desktop
          cp AppDir/steamalt.desktop AppDir/usr/share/applications/steamalt.desktop
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          set -eu
          HERE=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec "$HERE/usr/lib/steamalt/Steamalt" "$@"
          EOF
          chmod +x AppDir/AppRun AppDir/usr/lib/steamalt/Steamalt
          export ARCH=${{ matrix.appimage_arch }}
          ./appimagetool.AppImage --appimage-extract-and-run \
            AppDir "Steamalt-${{ matrix.rid }}.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.rid }}
          path: Steamalt-${{ matrix.rid }}.AppImage
          if-no-files-found: error

  package:
    name: Package release archives
    needs: [build, appimage]
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled builds
        uses: actions/download-artifact@v4
        with:
          pattern: build-linux-*
          path: builds
          merge-multiple: false

      - name: Download AppImages
        uses: actions/download-artifact@v4
        with:
          pattern: appimage-linux-*
          path: appimages
          merge-multiple: false

      - name: Create archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Steamalt/linux-x64 Steamalt/linux-arm64
          cp -a builds/build-linux-x64/. Steamalt/linux-x64/
          cp -a builds/build-linux-arm64/. Steamalt/linux-arm64/
          cp appimages/appimage-linux-x64/Steamalt-linux-x64.AppImage Steamalt/linux-x64/
          cp appimages/appimage-linux-arm64/Steamalt-linux-arm64.AppImage Steamalt/linux-arm64/
          chmod +x Steamalt/linux-*/*.AppImage Steamalt/linux-* /dev/null 2>/dev/null || true
          (cd Steamalt/linux-x64 && tar -czf ../../Steamalt-linux-x64.tar.gz .)
          (cd Steamalt/linux-arm64 && tar -czf ../../Steamalt-linux-arm64.tar.gz .)
          zip -r Steamalt.zip Steamalt
          ls -lh Steamalt.zip Steamalt-linux-*.tar.gz

      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            Steamalt.zip
            Steamalt-linux-x64.tar.gz
            Steamalt-linux-arm64.tar.gz

  release:
    name: Publish GitHub release
    needs: [build, appimage, package]
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives

      - name: Download x64 AppImage
        uses: actions/download-artifact@v4
        with:
          name: appimage-linux-x64

      - name: Download ARM64 AppImage
        uses: actions/download-artifact@v4
        with:
          name: appimage-linux-arm64

      - name: Publish release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          artifacts: |
            Steamalt.zip
            Steamalt-linux-x64.tar.gz
            Steamalt-linux-arm64.tar.gz
            Steamalt-linux-x64.AppImage
            Steamalt-linux-arm64.AppImage
          tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          name: Steamalt ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          generateReleaseNotes: true
          prerelease: false
          makeLatest: true
          allowUpdates: true
